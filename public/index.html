    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* The lock screen is painted here, so the first view does not wait for the bundle. */
      .boot-screen {
        height: 100vh;
        padding-top: 30px;
        background: #000 url(/wallpapers/lockScreenWall.webp) center / cover;
        color: #fff;
        font: 24px / 1.5 system-ui, sans-serif;
        text-align: center;
      }
      .boot-title {
        position: fixed;
        bottom: 30px;
        left: 30px;
        margin: 0;
        font-size: 3.5rem;
        line-height: 1.2;
        text-align: left;
      }
      /* The taskbar is 40px tall and spans the bottom edge, so the panel sits above it. */
      body .a11yp {
        bottom: 56px;
      }
      body .a11yp__panel {
        max-height: calc(100vh - 132px);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
